<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Biryani House</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f7f7f7;
}

header{
    background:#d35400;
    color:white;
    text-align:center;
    padding:20px;
}

.menu{
    padding:20px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    background:white;
    width:250px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card h3{
    margin:10px 0 5px;
}

.card p{
    margin:5px 0;
    font-weight:bold;
}

button{
    background:#25D366;
    color:white;
    border:none;
    padding:10px;
    width:100%;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1ebe5d;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>Royal Biryani House</h1>
<p>Fresh & Authentic Biryani</p>
</header>

<div class="menu">

    <div class="card">
        <img src="images/chicken.jpg" alt="Chicken Biryani">
        <h3>Chicken Biryani</h3>
        <p>₹180</p>
        <button onclick="alert('Chicken Biryani selected!')">Order</button>
    </div>

    <div class="card">
        <img src="images/mutton.jpg" alt="Mutton Biryani">
        <h3>Mutton Biryani</h3>
        <p>₹280</p>
        <button onclick="alert('Mutton Biryani selected!')">Order</button>
    </div>

    <div class="card">
        <img src="images/veg.jpg" alt="Veg Biryani">
        <h3>Veg Biryani</h3>
        <p>₹150</p>
        <button onclick="alert('Veg Biryani selected!')">Order</button>
    </div>

</div>

<footer>
Contact: +91 XXXXX XXXXX
</footer>
<a href="https://wa.me/91XXXXXXXXXX">
   Order on WhatsApp
</a>

</body>
</html>
